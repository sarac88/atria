services:
  postgres:
    image: postgres:16
    container_name: atria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atria
      POSTGRES_PASSWORD: atria
      POSTGRES_DB: atria
    ports:
      - "5432:5432"
    volumes:
      - atria-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atria -d atria"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  atria-pgdata:
